{{define "setup.html"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>gpuless</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/gpuless.css">
<script type="application/json" id="i18n">{"lang":{{.Lang}},"strings":{{json .Strings}}}</script>
</head>
<body>
<div class="dots">
  <div class="center">
    <div class="stack">
      <span id="mark" style="display:flex"></span>
      <h1>{{index .Strings "setup.title"}}</h1>
      <p class="lead">{{index .Strings "setup.lead"}}</p>
      <div class="card">
        <div class="card-tabs" id="steps"></div>
        <div class="card-body" id="body"></div>
        <div class="card-foot" id="foot"></div>
      </div>
    </div>
  </div>
  <div class="langs">
    <span class="mono">gpuless {{.Version}}</span>
    <span class="sep">·</span>
    {{range $i, $l := .Languages}}{{if $i}}<span class="sep">·</span>{{end}}<a data-lang="{{$l.Code}}" class="{{if eq $l.Code $.Lang}}on{{end}}">{{$l.Name}}</a>{{end}}
  </div>
</div>
<script src="/static/common.js"></script>
<script src="/static/setup.js"></script>
</body>
</html>{{end}}
